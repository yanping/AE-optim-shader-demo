# ==============================================================================
# Google Cloud AlphaEvolve Shader Optimization Configuration
# ==============================================================================
# This file serves as the Single Source of Truth for the project,
# unifying GCP authentication, evolution hyperparameters, model mixture weights,
# quality gates, and local hardware rendering benchmark settings.
# ==============================================================================

# 1. Google Cloud & Gemini Enterprise Credentials and Service Settings
gcp:
  project_id: "<YOUR_GCP_PROJECT_ID>" # Enter your Google Cloud Project ID here (e.g., my-gcp-project-123)
  location: "global"
  collection: "default_collection"
  ge_app_id: "<YOUR_GE_APP_ID>"       # Enter your Gemini Enterprise App/Engine ID here (e.g., gemini-enterprise-12345678)
  assistant: "default_assistant"
  base_url: "discoveryengine.googleapis.com"
  # Official alpha_evolve library path (can specify absolute or relative path)
  alpha_evolve_path: "./alpha_evolve"

# 2. Evolution Control & Hyperparameter Settings
evolution:
  max_programs_generated: 50    # Adjust based on experiment requirements
  max_programs_evaluated: 50    # Adjust based on experiment requirements
  # [IMPORTANT] Local hardware GPU benchmarking MUST be serialized!
  # Multiple concurrent evaluation workers will cause browser tabs to compete for the
  # physical GPU command queue, causing driver contention, context switches, and
  # jitter in microsecond-level hardware timer queries (EXT_disjoint_timer_query).
  concurrency: 1
  worker_concurrency: 1
  parallel_evaluation: false
  idle_timeout_s: 120

# 3. Gemini LLM Generation Mixture Weights
models:
  - name: "gemini-3.5-flash"
    weight: 0.70
  - name: "gemini-3.1-pro-preview"
    weight: 0.30

# 4. Perceptual Quality Gate Thresholds
quality:
  flip_initial_threshold: 0.980    # NVIDIA FLIP initial quality gate (≥ 98%)
  flip_relaxed_threshold: 0.950    # Relaxed minimum quality gate (≥ 95%)
  relaxation_patience: 10          # Consecutive failed generations before relaxing threshold
  min_ssim_threshold: 0.950        # SSIM auxiliary minimum threshold

# 5. WebGL 2.0 Local Hardware Benchmark Harness Settings
benchmark:
  port: 8099                       # Local evaluation HTTP server port
  headless: true                   # Run Playwright Chromium in headless mode
  resolution: [1280, 720]          # Benchmark canvas resolution [width, height]
  sample_times: [0.0, 1.5, 3.0, 4.5, 6.0]  # Sampled shader animation timestamps in seconds
  warmup_frames: 30                # GPU warmup frames (bypasses pipeline compilation overhead)
  timed_samples: 12                # Hardware GPU timer query samples per timestamp (median taken)
  playwright_channel: "chrome"     # Browser channel (chrome / chromium)
